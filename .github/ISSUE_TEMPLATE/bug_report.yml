name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**This issue is public.** Never paste real bank or card data, account or card numbers, names, addresses or document numbers. For a CSV problem, share only the header row and one made-up line."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all real financial and personal data from this report
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you ask your assistant, which tool ran, and what did you expect instead?
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `life-admin-mcp --version`
      placeholder: life-admin-mcp 1.0.0
    validations: { required: true }
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options: [Claude Desktop, Claude Code, Cursor, VS Code, Other]
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Run with `--log-level DEBUG` and paste the relevant lines. Please remove any personal data first.
      render: text
