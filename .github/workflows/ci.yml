name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        mcp: ["mcp>=1.10,<2", "mcp>=2,<3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]" "${{ matrix.mcp }}"
      - run: pytest -q

  release:
    # Push a tag like v1.0.0 to publish to PyPI, the official MCP Registry and GitHub Releases.
    # One-time setup: on pypi.org add this repo as a "trusted publisher"
    # (workflow: ci.yml, environment: pypi). No secrets are needed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing + MCP Registry OIDC login
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Check tag matches package and server.json versions
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/life_admin_mcp/__init__.py').read())[1])")
          SRV=$(python -c "import json;d=json.load(open('server.json'));print(d['version'], d['packages'][0]['version'])")
          echo "tag=$TAG package=$PKG server.json=$SRV"
          [ "$TAG" = "$PKG" ] && [ "$SRV" = "$TAG $TAG" ]

      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # PyPI can take a minute to serve a new release; retry until the registry sees it.
          for i in 1 2 3 4 5 6; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1

      - name: Create GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md)
