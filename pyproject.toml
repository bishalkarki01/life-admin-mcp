[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "life-admin-mcp"
dynamic = ["version"]
description = "MCP server that finds recurring subscriptions in your bank statement CSV, tracks trials, bills and expiring documents, and suggests what to cancel. Local storage, no network calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bishal Karki" }]
keywords = ["mcp", "model-context-protocol", "subscriptions", "personal-finance", "bank-statement", "budgeting", "reminders", "claude"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["mcp>=1.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
life-admin-mcp = "life_admin_mcp.server:main"

[project.urls]
Homepage = "https://github.com/bishalkarki01/life-admin-mcp"
Issues = "https://github.com/bishalkarki01/life-admin-mcp/issues"

[tool.hatch.version]
path = "src/life_admin_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/life_admin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S608", "UP007", "UP045"]  # S608: SQL built only from an allow-list of column names

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"demo/*" = ["E501", "S108"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
exclude = ["docs", "demo", ".github"]
